name: Bug Report
description: Report a bug or defect in Phylaworld
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please search
        the existing issues first to avoid duplicates.
  - type: input
    id: godot_version
    attributes:
      label: Godot Version
      description: The exact Godot version you're running (e.g. 4.7)
      placeholder: "4.7"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the bug happen?
      multiple: true
      options:
        - Windows
        - Linux
        - Android
        - Web
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you expect to happen, and what actually happened?
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the bug.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Error Output
      description: Paste any errors from the Godot debugger or terminal here.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: If applicable, add screenshots or a video to help explain the problem.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched for existing issues and this is not a duplicate.
          required: true
        - label: I have included platform and Godot version information.
          required: true